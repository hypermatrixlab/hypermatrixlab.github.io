<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Whenly — the modern way to schedule group meetings. Free, no sign-up, real-time. Paint your free times and instantly see when everyone overlaps.">
  <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">
  <title>Whenly — find a time, together.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 16v16l11 6' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <style>
    /* ============================================================
       Tokens
       ============================================================ */
    :root {
      --bg:           #08090f;
      --bg-elev:      #10121a;
      --card:         #14171f;
      --card-2:       #1a1e29;
      --card-hi:      #232838;
      --border:       #232838;
      --border-hi:    #2e3548;
      --text:         #f5f6fa;
      --text-dim:     #9aa3b8;
      --text-faint:   #5e667c;
      --accent:       #818cf8;          /* indigo-400 */
      --accent-2:     #c084fc;          /* purple-400 */
      --accent-3:     #f472b6;          /* pink-400 */
      --accent-soft:  rgba(129, 140, 248, 0.10);
      --accent-glow:  rgba(192, 132, 252, 0.35);
      --danger:       #f87171;
      --success:      #34d399;
      --warn:         #fbbf24;
      --shadow-sm:    0 2px 8px rgba(0,0,0,0.25);
      --shadow-md:    0 8px 24px rgba(0,0,0,0.35);
      --shadow-lg:    0 24px 60px rgba(0,0,0,0.45);
      --radius:       14px;
      --radius-sm:    10px;
      --radius-lg:    20px;
      --grad-brand:   linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --grad-soft:    linear-gradient(135deg, rgba(99,102,241,0.20), rgba(236,72,153,0.20));
    }
    [data-theme="light"] {
      --bg:           #f7f8fc;
      --bg-elev:      #ffffff;
      --card:         #ffffff;
      --card-2:       #f2f4fa;
      --card-hi:      #e8ecf5;
      --border:       #e2e6f0;
      --border-hi:    #cdd3e2;
      --text:         #0e1424;
      --text-dim:     #5c6582;
      --text-faint:   #8d96ad;
      --accent:       #6366f1;
      --accent-2:     #9333ea;
      --accent-3:     #db2777;
      --accent-soft:  rgba(99, 102, 241, 0.10);
      --accent-glow:  rgba(147, 51, 234, 0.25);
      --shadow-sm:    0 2px 8px rgba(14, 20, 36, 0.06);
      --shadow-md:    0 8px 24px rgba(14, 20, 36, 0.08);
      --shadow-lg:    0 24px 60px rgba(14, 20, 36, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background:
        radial-gradient(800px 600px at 10% -10%, rgba(99,102,241,0.18), transparent 60%),
        radial-gradient(700px 500px at 90% 10%, rgba(236,72,153,0.12), transparent 60%);
    }
    [data-theme="light"] body::before {
      background:
        radial-gradient(800px 600px at 10% -10%, rgba(99,102,241,0.08), transparent 60%),
        radial-gradient(700px 500px at 90% 10%, rgba(236,72,153,0.05), transparent 60%);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }
    button { font-family: inherit; }

    /* ============================================================
       Layout
       ============================================================ */
    .app { max-width: 1180px; margin: 0 auto; padding: 18px 22px 60px; }
    .navbar {
      display: flex; align-items: center; gap: 14px;
      padding: 6px 0 22px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 18px; letter-spacing: -0.01em;
      color: var(--text); cursor: pointer;
    }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--grad-brand);
      display: grid; place-items: center;
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .brand-mark svg { width: 16px; height: 16px; color: white; }
    .nav-spacer { flex: 1; }
    .nav-link { color: var(--text-dim); font-size: 14px; font-weight: 500; }
    .nav-link:hover { color: var(--text); }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text-dim); cursor: pointer; display: grid; place-items: center;
      transition: all 0.15s ease;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border-hi); background: var(--card-2); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ============================================================
       Buttons
       ============================================================ */
    .btn {
      appearance: none; border: 1px solid var(--border);
      background: var(--card-2); color: var(--text);
      padding: 10px 18px; font-size: 14px; font-weight: 500;
      border-radius: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--grad-brand);
      color: white; border-color: transparent;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .btn-primary:hover { box-shadow: 0 12px 28px var(--accent-glow); transform: translateY(-1px); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
    .btn-ghost:hover { color: var(--text); background: var(--card-2); border-color: var(--border); }
    .btn-lg { padding: 14px 24px; font-size: 15px; border-radius: 14px; }
    .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn svg { width: 16px; height: 16px; }

    /* ============================================================
       Hero / Landing
       ============================================================ */
    .hero {
      padding: 36px 0 12px;
      display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px;
      align-items: center;
    }
    @media (max-width: 920px) { .hero { grid-template-columns: 1fr; gap: 36px; } }

    .hero h1 {
      font-size: clamp(38px, 6vw, 62px);
      line-height: 1.02;
      letter-spacing: -0.035em;
      margin: 14px 0 18px;
      font-weight: 700;
    }
    .hero h1 .grad {
      background: var(--grad-brand);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p.lead {
      font-size: 18px; color: var(--text-dim);
      margin: 0 0 28px; max-width: 540px;
    }
    .hero .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-2);
      font-size: 13px; font-weight: 500;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .hero .badge .pulse {
      width: 7px; height: 7px; background: var(--accent-2); border-radius: 50%;
      box-shadow: 0 0 0 0 var(--accent-glow);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      70% { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }

    /* Simulation widget */
    .sim {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px;
      box-shadow: var(--shadow-lg);
      position: relative; overflow: hidden;
      isolation: isolate;
      animation: floatIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sim::before {
      content: ""; position: absolute; inset: -50%;
      background: radial-gradient(circle at 20% 0%, var(--accent-glow), transparent 50%);
      opacity: 0.4; pointer-events: none;
      z-index: 0;
    }
    .sim > * { position: relative; z-index: 1; }
    .sim-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .sim-dots { display: flex; gap: 6px; flex-shrink: 0; }
    .sim-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-hi); }
    .sim-dot:nth-child(1) { background: #ff5f57; }
    .sim-dot:nth-child(2) { background: #febc2e; }
    .sim-dot:nth-child(3) { background: #28c840; }
    .sim-title {
      color: var(--text-dim); font-size: 12px; margin-left: 8px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1;
    }

    .sim-people {
      display: flex; gap: 6px; margin-bottom: 12px;
      flex-wrap: wrap;
      min-height: 28px; align-items: center;
    }
    .sim-person {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 500; color: var(--text);
      background: var(--card-2); border: 1px solid var(--border);
      animation: chipIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes chipIn {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }
    .sim-person .swatch { width: 8px; height: 8px; border-radius: 50%; }
    .sim-grid {
      display: grid;
      grid-template-columns: 36px repeat(5, minmax(0, 1fr));
      gap: 4px;
      grid-auto-rows: 30px;
      margin-bottom: 4px;
    }
    .sim-head-cell {
      font-size: 10px; color: var(--text-faint);
      text-transform: uppercase; text-align: center;
      padding-bottom: 6px; font-weight: 600; letter-spacing: 0.06em;
      display: flex; align-items: flex-end; justify-content: center;
      height: auto; grid-row: 1;
    }
    .sim-grid > .sim-head-cell { grid-row: 1; }
    .sim-time-cell {
      font-size: 10px; color: var(--text-faint);
      text-align: right; padding-right: 6px;
      display: flex; align-items: center; justify-content: flex-end;
      height: 30px;
    }
    .sim-cell {
      height: 30px;
      border-radius: 5px; background: var(--card-2);
      border: 1px solid var(--border);
      transition: background 0.4s ease, transform 0.2s ease;
      position: relative;
    }
    .sim-cell.best {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
      border-color: transparent;
      box-shadow: inset 0 0 0 2px var(--accent-2);
      animation: bestPulse 1.6s ease-in-out infinite;
    }
    @keyframes bestPulse {
      0%, 100% { box-shadow: inset 0 0 0 2px var(--accent-2); }
      50%      { box-shadow: inset 0 0 0 2px var(--accent-2), 0 0 0 3px color-mix(in srgb, var(--accent-2) 35%, transparent); }
    }
    .sim-caption {
      margin-top: 18px; padding-top: 14px;
      border-top: 1px dashed var(--border);
      font-size: 12.5px; color: var(--text-dim);
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap;
      min-height: 32px;
    }
    .sim-caption > span:not(.badge-best) { min-width: 0; }
    .sim-caption .badge-best {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 8px; background: var(--accent-soft); color: var(--accent-2);
      border-radius: 999px; font-weight: 600; font-size: 11px;
    }

    /* How it works */
    .how {
      margin-top: 80px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    }
    @media (max-width: 780px) { .how { grid-template-columns: 1fr; } }
    .how-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .how-card:hover { transform: translateY(-4px); border-color: var(--border-hi); }
    .how-num {
      display: inline-grid; place-items: center;
      width: 30px; height: 30px;
      background: var(--grad-brand); color: white;
      border-radius: 9px; font-weight: 700; font-size: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .how-card h3 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
    .how-card p { font-size: 14px; color: var(--text-dim); margin: 0; }

    /* Features */
    .features {
      margin-top: 64px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    }
    @media (max-width: 920px) { .features { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px) { .features { grid-template-columns: 1fr; } }
    .feature {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
    }
    .feature-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--grad-soft);
      display: grid; place-items: center;
      margin-bottom: 10px;
      color: var(--accent-2);
    }
    .feature-icon svg { width: 18px; height: 18px; }
    .feature h4 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
    .feature p { margin: 0; font-size: 13px; color: var(--text-dim); }

    /* Recents */
    .recents { margin-top: 56px; }
    .recents h3 { margin: 0 0 12px; font-size: 14px; color: var(--text-dim); font-weight: 500; }
    .recent-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .recent-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px;
      cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; gap: 10px;
    }
    .recent-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .recent-card .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--grad-soft); display: grid; place-items: center; color: var(--accent-2); flex-shrink: 0; }
    .recent-card .title { font-weight: 500; font-size: 14px; }
    .recent-card .meta { color: var(--text-faint); font-size: 12px; }
    .recent-card .grow { flex: 1; min-width: 0; overflow: hidden; }
    .recent-card .grow > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* FAQ */
    .faq { margin-top: 64px; }
    .faq h2 { font-size: 22px; margin: 0 0 16px; letter-spacing: -0.02em; }
    details.faq-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 18px; margin-bottom: 8px;
    }
    details.faq-item summary {
      cursor: pointer; list-style: none; font-weight: 500;
      display: flex; align-items: center; justify-content: space-between;
    }
    details.faq-item summary::after {
      content: "+"; font-size: 22px; color: var(--text-dim); font-weight: 300;
      transition: transform 0.18s ease;
    }
    details.faq-item[open] summary::after { transform: rotate(45deg); }
    details.faq-item p { margin: 10px 0 0; font-size: 14px; color: var(--text-dim); }

    /* Footer */
    .footer {
      margin-top: 80px; padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      color: var(--text-faint); font-size: 13px;
    }
    .footer .grow { flex: 1; }
    .footer a { color: var(--text-dim); }

    /* ============================================================
       Create modal / wizard
       ============================================================ */
    .modal-bg {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: grid; place-items: center;
      animation: fadeIn 0.18s ease;
      padding: 20px;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px;
      max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal.modal-sm { max-width: 420px; }
    .modal.modal-md { max-width: 520px; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
    .modal .modal-sub { color: var(--text-dim); margin: 0 0 22px; font-size: 14px; }
    .modal-foot { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

    /* Inputs */
    .input, .select, textarea.input {
      width: 100%; padding: 11px 14px;
      background: var(--bg-elev); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px;
      font-size: 14px; font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus, .select:focus, textarea.input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-dim); font-weight: 500; }
    .field-help { font-size: 12px; color: var(--text-faint); margin-top: 6px; line-height: 1.4; }
    .field-error {
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
      padding: 8px 12px; border-radius: 8px;
      font-size: 13px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 540px) { .row { grid-template-columns: 1fr; } }

    /* Mini calendar */
    .cal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 14px; user-select: none; }
    .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .cal-head .month { flex: 1; font-weight: 600; font-size: 14px; text-align: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { font-size: 10px; color: var(--text-faint); text-align: center; padding: 4px 0; font-weight: 700; letter-spacing: 0.06em; }
    .cal-day {
      aspect-ratio: 1; display: grid; place-items: center;
      font-size: 13px; border-radius: 8px; cursor: pointer;
      transition: background 0.1s ease, transform 0.1s ease;
    }
    .cal-day:hover { background: var(--card-2); }
    .cal-day.is-other { color: var(--text-faint); opacity: 0.4; }
    .cal-day.is-today { font-weight: 700; color: var(--accent-2); }
    .cal-day.is-selected {
      background: var(--grad-brand); color: white; font-weight: 600;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .cal-day.is-past { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; min-height: 50px; align-items: flex-start; }
    .chip {
      padding: 5px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-2);
      font-size: 12.5px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
      animation: chipIn 0.2s ease;
    }
    .chip button { appearance: none; border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0; font-size: 14px; opacity: 0.7; }
    .chip button:hover { opacity: 1; }
    .chips .hint { color: var(--text-faint); font-size: 13px; padding: 6px 4px; }

    /* ============================================================
       Room
       ============================================================ */
    .room-head {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 22px; border: 1px solid var(--border);
      background: var(--card); border-radius: var(--radius);
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .room-head .title-wrap { flex: 1; min-width: 220px; }
    .room-head h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -0.02em; }
    .room-head .meta { color: var(--text-dim); font-size: 13px; }
    .room-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .tz-banner {
      background: var(--card-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; color: var(--text-dim);
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .tz-banner.is-diff { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--card-2)); }
    .tz-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

    .room-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 920px) { .room-grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
    }
    .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font-size: 16px; flex: 1; }

    /* Paint mode selector */
    .modes { display: inline-flex; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
    .mode {
      appearance: none; border: 0; background: transparent;
      padding: 6px 12px; font-size: 12.5px; font-weight: 500;
      border-radius: 8px; color: var(--text-dim); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.12s ease;
    }
    .mode .swatch { width: 9px; height: 9px; border-radius: 50%; }
    .mode .swatch.yes { background: var(--success); }
    .mode .swatch.maybe { background: var(--warn); }
    .mode .swatch.no { background: var(--border-hi); border: 1px solid var(--text-faint); }
    .mode.is-active { background: var(--card-hi); color: var(--text); box-shadow: var(--shadow-sm); }

    /* Grid */
    .grid-wrap { overflow-x: auto; padding-bottom: 4px; margin: 0 -4px; padding: 0 4px 4px; }
    .grid-table { border-collapse: separate; border-spacing: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    .grid-table th, .grid-table td { padding: 0; }
    .col-head {
      font-size: 11px; font-weight: 600; color: var(--text-dim);
      text-align: center; padding: 4px 4px 8px; min-width: 64px;
    }
    .col-head .dow { display: block; color: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
    .col-head .dnum { display: block; font-size: 15px; color: var(--text); font-weight: 700; }
    .time-label {
      font-size: 10.5px; color: var(--text-faint); text-align: right;
      padding-right: 8px; width: 56px; vertical-align: top;
      transform: translateY(-7px); white-space: nowrap;
    }
    .grid-cell {
      width: 64px; height: 18px;
      background: var(--card-2);
      border-right: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.08s ease;
      position: relative;
    }
    .grid-cell.hour-mark { border-top: 1px solid var(--border-hi); }
    .grid-cell.minor-mark { border-top: 1px dashed var(--border); }
    .grid-cell.boundary-top { border-top: 1px solid var(--border-hi); }
    .grid-cell.last-col { border-right: 1px solid var(--border); }

    /* "Your" panel states */
    .grid-cell.you-yes { background: var(--success); }
    .grid-cell.you-maybe {
      background: repeating-linear-gradient(45deg, var(--warn) 0 4px, color-mix(in srgb, var(--warn) 45%, var(--card-2)) 4px 8px);
    }
    .grid-cell:hover { outline: 2px solid var(--accent); outline-offset: -1px; z-index: 1; }

    /* Group / heatmap */
    .grid-cell.heat { cursor: default; }
    .grid-cell.heat.in-best {
      box-shadow: inset 0 0 0 2px var(--accent-2);
    }

    /* Tooltip */
    .tip {
      position: absolute; pointer-events: none; opacity: 0;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border-hi); border-radius: 12px;
      padding: 12px 14px; font-size: 12.5px;
      box-shadow: var(--shadow-md);
      min-width: 200px; max-width: 320px;
      transition: opacity 0.12s ease;
      z-index: 100;
    }
    .tip.show { opacity: 1; }
    .tip .tip-time { font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--text); }
    .tip .tip-section { margin-top: 8px; }
    .tip .tip-label { font-size: 10px; text-transform: uppercase; color: var(--text-faint); letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 700; }
    .tip .tip-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .tip .tip-list .pchip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 999px;
      background: var(--card-2); border: 1px solid var(--border);
      font-size: 11.5px; color: var(--text);
    }
    .tip .tip-list .pchip .sw { width: 7px; height: 7px; border-radius: 50%; }
    .tip .tip-list .pchip.maybe { opacity: 0.7; font-style: italic; }
    .tip .tip-list .pchip.no { opacity: 0.5; text-decoration: line-through; }

    /* People & best times */
    .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .pchip-full {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 12px; background: var(--card-2); border: 1px solid var(--border);
      border-radius: 999px; font-size: 12.5px; color: var(--text);
    }
    .pchip-full .sw { width: 8px; height: 8px; border-radius: 50%; }
    .pchip-full.you { box-shadow: inset 0 0 0 1px var(--accent); }
    .pchip-full .cnt { color: var(--text-faint); font-size: 11px; }

    /* Best times */
    .best { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .best-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .best-head h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
    .dur-picker { display: inline-flex; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 1px; }
    .dur-btn {
      appearance: none; border: 0; background: transparent;
      padding: 4px 10px; font-size: 11.5px; font-weight: 500;
      border-radius: 6px; color: var(--text-dim); cursor: pointer;
      transition: all 0.12s ease;
    }
    .dur-btn.is-active { background: var(--card-hi); color: var(--text); box-shadow: var(--shadow-sm); }

    .best-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px 12px;
      padding: 12px 14px; border-radius: 10px;
      background: var(--card-2); border: 1px solid var(--border);
      margin-bottom: 8px;
      transition: all 0.15s ease;
      align-items: start;
    }
    .best-row:hover { border-color: var(--border-hi); background: var(--card-hi); }
    .best-row.is-top { border-color: color-mix(in srgb, var(--accent-2) 50%, transparent); background: color-mix(in srgb, var(--accent-2) 6%, var(--card-2)); }
    .best-row .when { font-weight: 500; font-size: 13.5px; min-width: 0; }
    .best-row .when .sub { font-size: 11.5px; color: var(--text-faint); font-weight: 400; display: block; margin-top: 2px; }
    .best-row .count {
      font-size: 12px; color: var(--text-dim);
      padding: 4px 10px; background: var(--bg-elev); border-radius: 999px;
      align-self: center; white-space: nowrap;
    }
    .best-row.is-top .count { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
    .best-row .export {
      padding: 5px 10px; font-size: 11.5px; border: 1px solid var(--border); background: var(--card);
      color: var(--text-dim); border-radius: 8px; cursor: pointer;
      transition: all 0.12s ease; align-self: center;
      display: inline-flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .best-row .export:hover { color: var(--accent-2); border-color: var(--accent); }
    .best-row .who { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
    .who-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
    .who-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint); font-weight: 700;
      flex-shrink: 0; min-width: 70px;
    }
    .who-label .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .who-label.yes .dot { background: var(--success); }
    .who-label.maybe .dot { background: var(--warn); }
    .who-label.no .dot { background: var(--text-faint); }
    .who-chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
    .pmini {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      font-size: 11.5px; color: var(--text);
      max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pmini .sw { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .pmini.maybe { font-style: italic; opacity: 0.85; }
    .pmini.no { opacity: 0.55; text-decoration: line-through; text-decoration-color: var(--text-faint); }

    /* Headings on landing */
    h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em; }
    h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; }
    .label-small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 700; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--card); border: 1px solid var(--border-hi); color: var(--text);
      padding: 10px 18px; border-radius: 999px; font-size: 13px;
      box-shadow: var(--shadow-lg);
      opacity: 0; transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Spinner */
    .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Setup card */
    .setup-card { max-width: 640px; margin: 40px auto 0; }
    .setup-step { background: var(--card-2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 14px 16px; margin-bottom: 10px; list-style: none; }
    .setup-step::before { content: counter(s); counter-increment: s; display: inline-grid; place-items: center; width: 22px; height: 22px; background: var(--accent); color: white; border-radius: 50%; font-weight: 700; font-size: 11px; margin-right: 8px; vertical-align: middle; }
    .setup-steps { counter-reset: s; padding-left: 0; }
    code, pre { font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; font-size: 12.5px; background: var(--bg); color: var(--accent-2); padding: 2px 6px; border-radius: 4px; }
    pre { padding: 12px 14px; overflow-x: auto; border: 1px solid var(--border); margin: 8px 0; color: var(--text); }
    pre code { padding: 0; background: transparent; color: inherit; }

    /* QR */
    .qr-box {
      background: white; padding: 14px; border-radius: 12px;
      display: grid; place-items: center;
      margin: 0 auto 14px; width: fit-content;
    }
    .qr-box img { display: block; }

    /* Misc */
    .hidden { display: none !important; }
    .text-dim { color: var(--text-dim); }
    .text-small { font-size: 13px; }
    .stack > * + * { margin-top: 14px; }
    .mt-4 { margin-top: 16px; }
    .mt-6 { margin-top: 24px; }
    .center { text-align: center; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); border: 1.5px dashed var(--border); border-radius: var(--radius); }
  </style>
</head>
<body>
  <main class="app">
    <nav class="navbar">
      <a class="brand" id="brand-home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

            <polyline points="12 7 12 12 16 14"/>
          </svg>

      </a>

        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>

    </footer>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    // ============================================================
    // Firebase config (Realtime DB)
    // ============================================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBA23VsXoGCYqQd6HFP169xDaZj1DX5XpM",
      authDomain: "hypermatrix-meet.firebaseapp.com",
      databaseURL: "https://hypermatrix-meet-default-rtdb.firebaseio.com",
      projectId: "hypermatrix-meet",
      storageBucket: "hypermatrix-meet.firebasestorage.app",
      messagingSenderId: "933576793454",
      appId: "1:933576793454:web:2ac4662e8091449d78f57f"
    };
    const FIREBASE_CONFIGURED = !!FIREBASE_CONFIG.databaseURL;

    // ============================================================
    // Theme
    // ============================================================
    (function initTheme() {
      const saved = localStorage.getItem("whenly.theme");
      if (saved) {
        document.documentElement.dataset.theme = saved;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.dataset.theme = "dark";
      } // else stays "light" from the HTML attribute
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const cur = document.documentElement.dataset.theme || "light";
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("whenly.theme", next);
      });
    })();

    // ============================================================
    // Utilities
    // ============================================================
    const $ = (s, r = document) => r.querySelector(s);
    const SVG_NS = "http://www.w3.org/2000/svg";
    const SVG_TAGS = new Set(["svg","path","circle","rect","line","polyline","polygon","ellipse","g","text","tspan","use","defs","linearGradient","radialGradient","stop","clipPath","mask","pattern","filter","marker","symbol","foreignObject","image"]);
    const el = (tag, attrs = {}, ...children) => {
      const isSvg = SVG_TAGS.has(tag);
      const n = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") {
          if (isSvg) n.setAttribute("class", v); else n.className = v;
        }
        else if (k === "html") n.innerHTML = v;
        else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
        else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v === false || v == null) continue;
        else if (v === true) n.setAttribute(k, "");
        else n.setAttribute(k, v);
      }
      for (const c of children.flat()) {
        if (c == null || c === false) continue;
        n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return n;
    };

    const randId = (n = 8) => {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      let s = "";
      for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    };

    const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const MO_SHORT = MO.map(m => m.slice(0,3));
    const fmt12h = m => { const h = Math.floor(m/60), mm = m%60; const ap = h>=12?"PM":"AM"; const h12 = h%12===0?12:h%12; return mm===0?`${h12} ${ap}`:`${h12}:${String(mm).padStart(2,"0")} ${ap}`; };
    const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); };
    const sanitizeName = s => String(s||"").trim().slice(0,40).replace(/[<>"]/g,"");

    async function hashPwd(s) {
      if (!s) return "";
      const buf = new TextEncoder().encode(`whenly|${s}`);
      const hash = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // User color palette
    const COLORS = [
      "#818cf8", "#22d3ee", "#f472b6", "#fbbf24", "#34d399", "#fb7185",
      "#60a5fa", "#a3e635", "#c084fc", "#fb923c", "#2dd4bf", "#e879f9",
    ];
    const colorFor = (idx) => COLORS[idx % COLORS.length];

    // ============================================================
    // Recent meetings (localStorage)
    // ============================================================
    const RECENT_KEY = "whenly.recents";
    function loadRecents() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; }
    }
    function saveRecent(roomId, title) {
      const list = loadRecents().filter(r => r.roomId !== roomId);
      list.unshift({ roomId, title, ts: Date.now() });
      localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8)));
    }
    function removeRecent(roomId) {
      localStorage.setItem(RECENT_KEY, JSON.stringify(loadRecents().filter(r => r.roomId !== roomId)));
    }

    // ============================================================
    // Firebase (lazy)
    // ============================================================
    let fbDb = null, fbMod = null;
    async function fb() {
      if (fbDb) return { db: fbDb, ...fbMod };
      const [appMod, dbMod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"),
      ]);
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      fbDb = dbMod.getDatabase(app);
      fbMod = dbMod;
      return { db: fbDb, ...dbMod };
    }

    // ============================================================
    // Routing
    // ============================================================
    function parseHash() {
      const h = location.hash.replace(/^#/, "");
      const params = new URLSearchParams(h);
      return { room: params.get("room"), action: params.get("action"), isNew: params.get("new") === "1" };
    }
    window.addEventListener("hashchange", route);
    $("#brand-home").addEventListener("click", e => { e.preventDefault(); location.hash = ""; });

    let routeAbort = null;
    let fbUnsubs = [];
    function teardownRoute() {
      if (routeAbort) routeAbort.abort();
      routeAbort = new AbortController();
      fbUnsubs.forEach(u => { try { u(); } catch {} });
      fbUnsubs = [];
      document.querySelectorAll(".modal-bg, .tip").forEach(n => n.remove());
    }

    function route() {
      teardownRoute();
      const view = $("#view");
      view.innerHTML = "";
      if (!FIREBASE_CONFIGURED) return renderSetup(view);
      const { room, isNew } = parseHash();
      if (room) renderRoom(view, room, isNew);
      else renderLanding(view);
    }
    route();

    // ============================================================
    // SETUP (only if Firebase not configured)
    // ============================================================
    function renderSetup(view) {
      view.appendChild(el("div", { class: "setup-card" },
        el("h1", {}, "Setup needed"),
        el("p", { class: "text-dim" }, "Whenly needs a free Firebase Realtime Database to sync availability between people. About 5 minutes — then paste the config into ", el("code", {}, "/meet/index.html"), " and push."),
        el("ol", { class: "setup-steps" },
          el("li", { class: "setup-step" }, "Go to ", el("a", { href: "https://console.firebase.google.com/", target: "_blank", rel: "noopener" }, "console.firebase.google.com"), " → ", el("b", {}, "Add project"), ". Skip Analytics."),
          el("li", { class: "setup-step" }, el("b", {}, "Build → Realtime Database → Create Database"), ". Pick a region. Start in test mode."),
          el("li", { class: "setup-step" }, el("b", {}, "Project Settings → General → Your apps"), ", click ", el("code", {}, "</>"), ", register the app and copy the config."),
          el("li", { class: "setup-step" }, "In ", el("b", {}, "Realtime DB → Rules"), " paste:", el("pre", {}, el("code", { html: `{<br>&nbsp; "rules": {<br>&nbsp;&nbsp; "rooms": { "$room": { ".read": true, ".write": true } }<br>&nbsp; }<br>}` }))),
          el("li", { class: "setup-step" }, "Paste the config into ", el("code", {}, "FIREBASE_CONFIG"), " in ", el("code", {}, "/meet/index.html"), " and push.")
        )
      ));
    }

    // ============================================================
    // LANDING
    // ============================================================
    function renderLanding(view) {
      // ---- Hero ----
      const sim = buildSim();
      view.appendChild(el("section", { class: "hero" },
        el("div", {},
          el("div", { class: "badge" }, el("span", { class: "pulse" }), "Free, no sign-up, no calendars linked"),
          el("h1", {}, "Find a time. ", el("span", { class: "grad" }, "Together.")),
          el("p", { class: "lead" }, "The fastest way to schedule a group meeting. Paint your free times. Watch the overlap appear live. Pick the best slot. Done."),
          el("div", { class: "hero-ctas" },
            el("button", { class: "btn btn-primary btn-lg", onClick: openCreate },
              el("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" }, el("path", { d: "M12 5v14M5 12h14" })),
              "Create a meeting"
            ),
            el("button", { class: "btn btn-lg", onClick: () => $("#how")?.scrollIntoView({ behavior: "smooth", block: "start" }) },
              "How it works"
            ),
          ),
        ),
        sim.node
      ));

      // Start the demo, stop on route change
      const simTimers = [];
      const tStart = setTimeout(() => sim.start(simTimers), 400);
      simTimers.push(tStart);
      routeAbort.signal.addEventListener("abort", () => simTimers.forEach(clearTimeout));

      // ---- How it works ----
      view.appendChild(el("section", { class: "how", id: "how" },
        el("div", { class: "how-card" },
          el("div", { class: "how-num" }, "1"),
          el("h3", {}, "Pick your days"),
          el("p", {}, "Tap days on a calendar, set a time range, then create. You'll get a shareable link instantly.")

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      if (s < 86400) return `${Math.floor(s/3600)}h ago`;
      const d = Math.floor(s / 86400);
      if (d < 30) return `${d}d ago`;
      return new Date(ts).toLocaleDateString();
    }

    // ============================================================
    // DEMO SIMULATION
    // ============================================================
    function buildSim() {
      const fakePeople = [
        { name: "Alex",    color: COLORS[0] },
        { name: "Riya",    color: COLORS[1] },
        { name: "Sam",     color: COLORS[2] },
        { name: "Jordan",  color: COLORS[3] },
      ];
      // grid: 5 days, 6 slots
      const days = ["Mon", "Tue", "Wed", "Thu", "Fri"];
      const dates = [22, 23, 24, 25, 26];
      const slots = ["9 AM","10 AM","11 AM","12 PM","1 PM","2 PM"];
      // Each fake person has availability as set of `${d},${s}`
      // Crafted so overlap is highest at Tue 11 AM (col 1, row 2): all 4 people
      const avail = [
        new Set(["0,0","0,1","0,2","1,1","1,2","1,3","2,3","2,4"]),               // Alex
        new Set(["0,2","1,2","1,3","2,2","2,3","3,3","3,4"]),                      // Riya
        new Set(["1,1","1,2","1,3","2,3","2,4","3,3","3,4","4,4","4,5"]),          // Sam
        new Set(["0,3","1,2","2,2","2,3","3,3","4,1","4,2","4,3"]),                // Jordan
      ];
      const BEST = "1,2"; // Tue 11 AM

      const peopleNode = el("div", { class: "sim-people" });
      const captionNode = el("div", { class: "sim-caption" });
      const grid = el("div", { class: "sim-grid" });

      // header row
      grid.appendChild(el("div", { class: "sim-head-cell" }, ""));
      days.forEach((d, i) => grid.appendChild(el("div", { class: "sim-head-cell" }, `${d} ${dates[i]}`)));

      // grid rows
      const cells = []; // cells[s][d]
      for (let s = 0; s < slots.length; s++) {
        grid.appendChild(el("div", { class: "sim-time-cell" }, slots[s]));
        const row = [];
        for (let d = 0; d < days.length; d++) {
          const c = el("div", { class: "sim-cell" });
          grid.appendChild(c);
          row.push(c);
        }
        cells.push(row);
      }

      const node = el("div", { class: "sim" },
        el("div", { class: "sim-head" },
          el("div", { class: "sim-dots" },
            el("span", { class: "sim-dot" }), el("span", { class: "sim-dot" }), el("span", { class: "sim-dot" })
          ),
          el("div", { class: "sim-title" }, "whenly.app/meeting/lab-standup")
        ),
        peopleNode,
        grid,
        captionNode
      );

      // ---- Simulation state ----
      const tally = {}; // "d,s" -> [colors]
      let stepTimers = [];

      function paintCells() {
        cells.forEach(row => row.forEach(c => { c.style.background = ""; c.classList.remove("best"); }));
        for (const [key, colors] of Object.entries(tally)) {
          const [d, s] = key.split(",").map(Number);
          const ratio = Math.min(1, colors.length / fakePeople.length);
          const c = cells[s][d];
          c.style.background = `color-mix(in srgb, ${colors[0]} ${30 + ratio * 50}%, transparent)`;
        }
      }

      function reset() {
        for (const k of Object.keys(tally)) delete tally[k];
        peopleNode.innerHTML = "";
        captionNode.innerHTML = "";
        paintCells();
      }

      let outerTimers = null;
      function step(t, fn) {
        const id = setTimeout(fn, t);
        stepTimers.push(id);
        if (outerTimers) outerTimers.push(id);
      }

      function loop() {
        // clear pending
        stepTimers.forEach(clearTimeout);
        stepTimers = [];
        reset();

        let t = 200;
        fakePeople.forEach((p, idx) => {
          step(t, () => {
            peopleNode.appendChild(el("span", { class: "sim-person" },
              el("span", { class: "swatch", style: { background: p.color } }),
              p.name
            ));
            captionNode.innerHTML = "";
            captionNode.appendChild(el("span", {}, `${p.name} is adding availability…`));
          });
          // paint their cells
          let pt = t + 250;
          const cellArr = [...avail[idx]];
          cellArr.forEach((key, i) => {
            step(pt + i * 90, () => {
              (tally[key] = tally[key] || []).push(p.color);
              const [d, s] = key.split(",").map(Number);
              const ratio = Math.min(1, tally[key].length / fakePeople.length);
              const c = cells[s][d];
              c.style.background = `color-mix(in srgb, ${tally[key][0]} ${30 + ratio * 50}%, transparent)`;
              c.style.transform = "scale(1.15)";
              setTimeout(() => c.style.transform = "", 140);
            });
          });
          t = pt + cellArr.length * 90 + 250;
        });

        // Reveal best time
        step(t, () => {
          const [d, s] = BEST.split(",").map(Number);
          cells[s][d].classList.add("best");
          captionNode.innerHTML = "";
          captionNode.appendChild(el("span", { class: "badge-best" }, "★ Best time"));
          captionNode.appendChild(el("span", {}, `Tuesday ${dates[d]} at ${slots[s]} — everyone's free.`));
        });

        // Loop again
        step(t + 3800, loop);
      }

      return {
        node,
        start: (outer) => { outerTimers = outer || null; loop(); },
      };
    }

    // ============================================================
    // CREATE meeting modal
    // ============================================================
    function openCreate() {
      const today = new Date(); today.setHours(0,0,0,0);
      let selectedDates = new Set();
      let calMonth = today.getMonth();
      let calYear = today.getFullYear();
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      const modalAC = new AbortController();
      const sig = modalAC.signal;

      const calMount = el("div");
      const chipMount = el("div", { class: "chips" });

      function makeDay(d) {
        const key = ymd(d);
        const inMo = d.getMonth() === calMonth;
        const isToday = key === ymd(today);
        const isPast = d < today;
        const isSel = selectedDates.has(key);
        const cls = ["cal-day"];
        if (!inMo) cls.push("is-other");
        if (isToday) cls.push("is-today");
        if (isSel) cls.push("is-selected");
        if (isPast) cls.push("is-past");
        return el("div", { class: cls.join(" "), "data-key": key, "data-past": isPast ? "1" : null }, String(d.getDate()));
      }
      function renderCal() {
        const first = new Date(calYear, calMonth, 1);
        const start = new Date(first); start.setDate(1 - first.getDay());
        const cells = [];
        for (let i = 0; i < 42; i++) {
          const d = new Date(start); d.setDate(start.getDate() + i);
          cells.push(makeDay(d));
        }
        return el("div", { class: "cal" },
          el("div", { class: "cal-head" },
            el("button", { class: "icon-btn", type: "button", style: { width: "30px", height: "30px" }, "aria-label": "Previous month",
              onClick: () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } updateCal(); } },
              el("svg", { viewBox: "0 0 24 24", width: "16", height: "16", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round", "stroke-linejoin": "round" }, el("polyline", { points: "15 18 9 12 15 6" }))),
            el("div", { class: "month" }, `${MO[calMonth]} ${calYear}`),
            el("button", { class: "icon-btn", type: "button", style: { width: "30px", height: "30px" }, "aria-label": "Next month",
              onClick: () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } updateCal(); } },
              el("svg", { viewBox: "0 0 24 24", width: "16", height: "16", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round", "stroke-linejoin": "round" }, el("polyline", { points: "9 18 15 12 9 6" })))
          ),
          el("div", { class: "cal-grid" },
            ...["S","M","T","W","T","F","S"].map(d => el("div", { class: "cal-dow" }, d)),
            ...cells
          )
        );
      }
      function renderChips() {
        const sorted = [...selectedDates].sort();
        const node = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", width: "100%" } });
        if (!sorted.length) node.appendChild(el("span", { class: "hint" }, "Click or drag across days on the calendar below"));
        sorted.forEach(s => {
          const d = parseYmd(s);
          node.appendChild(el("span", { class: "chip" },
            `${DOW[d.getDay()]} ${MO_SHORT[d.getMonth()]} ${d.getDate()}`,
            el("button", { onClick: () => { selectedDates.delete(s); updateChips(); refreshCells(); }, "aria-label": "remove" }, "×")
          ));
        });
        return node;
      }
      function updateChips() { chipMount.replaceChildren(renderChips()); }
      function updateCal() { calMount.replaceChildren(renderCal()); updateChips(); }
      function refreshCells() {
        calMount.querySelectorAll(".cal-day").forEach(c => {
          c.classList.toggle("is-selected", selectedDates.has(c.dataset.key));
        });
      }

      // Drag-select
      let dragMode = null;
      function applyDay(dayEl) {
        if (!dayEl) return;
        const k = dayEl.dataset.key;
        if (!k || dayEl.dataset.past === "1") return;
        if (dragMode === "add") {
          if (!selectedDates.has(k)) {
            if (selectedDates.size >= 21) { toast("Up to 21 days"); dragMode = null; return; }
            selectedDates.add(k);
            dayEl.classList.add("is-selected");
          }
        } else {
          if (selectedDates.has(k)) {
            selectedDates.delete(k);
            dayEl.classList.remove("is-selected");
          }
        }
      }
      function dayAtPoint(x, y) {
        const e = document.elementFromPoint(x, y);
        return e ? e.closest(".cal-day") : null;
      }
      calMount.addEventListener("mousedown", (e) => {
        const day = e.target.closest(".cal-day");
        if (!day || day.dataset.past === "1") return;
        e.preventDefault();
        dragMode = selectedDates.has(day.dataset.key) ? "remove" : "add";
        applyDay(day);
      }, { signal: sig });
      document.addEventListener("mousemove", (e) => {
        if (!dragMode) return;
        applyDay(dayAtPoint(e.clientX, e.clientY));
      }, { signal: sig });
      document.addEventListener("mouseup", () => {
        if (dragMode) updateChips();
        dragMode = null;
      }, { signal: sig });
      calMount.addEventListener("touchstart", (e) => {
        const day = e.target.closest(".cal-day");
        if (!day || day.dataset.past === "1") return;
        e.preventDefault();
        dragMode = selectedDates.has(day.dataset.key) ? "remove" : "add";
        applyDay(day);
      }, { passive: false, signal: sig });
      document.addEventListener("touchmove", (e) => {
        if (!dragMode) return;
        const t = e.touches[0];
        const day = dayAtPoint(t.clientX, t.clientY);
        if (day) { e.preventDefault(); applyDay(day); }
      }, { passive: false, signal: sig });
      document.addEventListener("touchend", () => {
        if (dragMode) updateChips();
        dragMode = null;
      }, { signal: sig });

      const closeBg = () => { modalAC.abort(); bg.remove(); };
      const bg = el("div", { class: "modal-bg", onClick: e => { if (e.target === bg) closeBg(); } });
      const titleInput = el("input", { class: "input", placeholder: "e.g. Lab standup", maxlength: 80 });
      const startSel = el("select", { class: "select" }, ...Array.from({ length: 24 }, (_, h) => el("option", { value: String(h * 60), selected: h === 9 }, fmt12h(h * 60))));
      const endSel = el("select", { class: "select" }, ...Array.from({ length: 24 }, (_, h) => el("option", { value: String((h + 1) * 60), selected: h === 21 }, fmt12h((h + 1) * 60 === 1440 ? 1440 : (h + 1) * 60))));
      const slotSel = el("select", { class: "select" },
        el("option", { value: "15" }, "15 minutes"),
        el("option", { value: "20" }, "20 minutes"),
        el("option", { value: "30", selected: true }, "30 minutes"),
        el("option", { value: "45" }, "45 minutes"),
        el("option", { value: "60" }, "1 hour"),
        el("option", { value: "90" }, "1.5 hours"),
        el("option", { value: "120" }, "2 hours"),
        el("option", { value: "180" }, "3 hours"),
      );
      const tzInput = el("input", { class: "input", value: tz });

      const createBtn = el("button", { class: "btn btn-primary", style: { flex: "1", justifyContent: "center" } },
        el("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" }, el("path", { d: "M5 12h14M13 5l7 7-7 7" })),
        "Create"
      );
      createBtn.addEventListener("click", async () => {
        const title = sanitizeName(titleInput.value) || "Untitled meeting";
        const dates = [...selectedDates].sort();
        if (!dates.length) { toast("Pick at least one day"); return; }
        const startMin = Number(startSel.value);
        const endMin = Number(endSel.value);
        if (endMin <= startMin) { toast("End must be after start"); return; }
        const slotMin = Number(slotSel.value);
        const room = randId(8);
        const meta = { title, dates, startMin, endMin, slotMin, tz: tzInput.value.trim() || "UTC", createdAt: Date.now() };
        try {
          createBtn.disabled = true;
          createBtn.innerHTML = "";
          createBtn.appendChild(el("div", { class: "spinner", style: { borderTopColor: "white" } }));
          const { db, ref, set } = await fb();
          await set(ref(db, `rooms/${room}/meta`), meta);
          saveRecent(room, title);
          closeBg();
          location.hash = `room=${room}&new=1`;
        } catch (e) {
          console.error(e);
          toast("Could not create — check Firebase");
          createBtn.disabled = false; createBtn.textContent = "Create";
        }
      });

      bg.appendChild(el("div", { class: "modal modal-md" },
        el("h2", {}, "Create a meeting"),
        el("p", { class: "modal-sub" }, "Pick your days and time range. Everyone gets a link."),
        el("div", { class: "field" }, el("label", {}, "Title"), titleInput),
        el("div", { class: "field" }, el("label", {}, "Days"), chipMount),
        el("div", { class: "field" }, calMount),
        el("div", { class: "row mt-4" },
          el("div", { class: "field" }, el("label", {}, "Earliest"), startSel),
          el("div", { class: "field" }, el("label", {}, "Latest"), endSel),
        ),
        el("div", { class: "row" },
          el("div", { class: "field" }, el("label", {}, "Slot length"), slotSel),
          el("div", { class: "field" }, el("label", {}, "Timezone"), tzInput),
        ),
        el("div", { class: "modal-foot" },
          el("button", { class: "btn btn-ghost", onClick: closeBg }, "Cancel"),
          createBtn
        )
      ));
      document.body.appendChild(bg);
      updateCal();
      setTimeout(() => titleInput.focus(), 60);
    }

    // ROOM
    // ============================================================
    async function renderRoom(view, roomId, isNew = false) {
      view.appendChild(el("div", { class: "panel" },
        el("div", { style: { display: "flex", alignItems: "center", gap: "10px" } },
          el("div", { class: "spinner" }), el("span", { class: "text-dim" }, "Loading meeting…"))
      ));

      let mod;
      try { mod = await fb(); } catch { return showErr(view, "Could not connect."); }
      const { db, ref, onValue, set, update, get, remove } = mod;

      const metaSnap = await get(ref(db, `rooms/${roomId}/meta`)).catch(() => null);
      if (!metaSnap || !metaSnap.exists()) return showErr(view, "Meeting not found. The link may be wrong or the meeting was deleted.");
      const meta = metaSnap.val();

      saveRecent(roomId, meta.title);

      // identity
      const idKey = `whenly.id.${roomId}`;
      const nameKey = `whenly.name.${roomId}`;
      let myId = localStorage.getItem(idKey);
      let myName = localStorage.getItem(nameKey);
      let myColor = localStorage.getItem(`whenly.color.${roomId}`);

      // Validate stored identity against current participants
      if (myId) {
        const meSnap = await get(ref(db, `rooms/${roomId}/participants/${myId}`)).catch(() => null);
        if (!meSnap || !meSnap.exists()) {
          myId = null; myName = null; myColor = null;
          localStorage.removeItem(idKey);
          localStorage.removeItem(nameKey);
          localStorage.removeItem(`whenly.color.${roomId}`);
        }
      }

      if (!myId || !myName) {
        let errorMsg = null;
        let lastName = "";
        while (true) {
          const result = await promptName(meta.title, { errorMsg, currentName: lastName });
          if (!result) { location.hash = ""; return; }
          const { name, password } = result;
          lastName = name;

          const existing = (await get(ref(db, `rooms/${roomId}/participants`))).val() || {};
          const match = Object.entries(existing).find(([, p]) => p.name === name);

          if (match) {
            const [pid, p] = match;
            if (p.passwordHash) {
              if (!password) { errorMsg = `"${name}" is taken — enter the password to continue as them.`; continue; }
              const hash = await hashPwd(password);
              if (hash !== p.passwordHash) { errorMsg = "Wrong password for that name."; continue; }
              myId = pid; myName = name; myColor = p.color || colorFor(0);
            } else {
              // No password set — claim it; if user provided a password, lock it down now
              myId = pid; myName = name; myColor = p.color || colorFor(0);
              if (password) {
                await update(ref(db, `rooms/${roomId}/participants/${pid}`), { passwordHash: await hashPwd(password) });
              }
            }
          } else {
            myId = randId(10);
            myName = name;
            const used = Object.values(existing).map(p => p.color).filter(Boolean);
            myColor = COLORS.find(c => !used.includes(c)) || colorFor(Object.keys(existing).length);
            const data = { name: myName, color: myColor, joinedAt: Date.now() };
            if (password) data.passwordHash = await hashPwd(password);
            await set(ref(db, `rooms/${roomId}/participants/${myId}`), data);
          }

          localStorage.setItem(idKey, myId);
          localStorage.setItem(nameKey, myName);
          localStorage.setItem(`whenly.color.${roomId}`, myColor);
          break;
        }
      }
      if (!myColor) {
        myColor = colorFor(0);
        localStorage.setItem(`whenly.color.${roomId}`, myColor);
        await update(ref(db, `rooms/${roomId}/participants/${myId}`), { color: myColor });
      }

      // ---- Build UI ----
      view.innerHTML = "";

      const dates = meta.dates;
      const startMin = meta.startMin;
      const endMin = meta.endMin;
      const slotMin = meta.slotMin;
      const slotsPerDay = Math.floor((endMin - startMin) / slotMin);

      const dateLabel = (() => {
        if (dates.length === 1) { const d = parseYmd(dates[0]); return `${DOW[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}`; }
        const a = parseYmd(dates[0]); const b = parseYmd(dates[dates.length - 1]);
        return `${MO_SHORT[a.getMonth()]} ${a.getDate()} – ${MO_SHORT[b.getMonth()]} ${b.getDate()} · ${dates.length} days`;
      })();

      const head = el("div", { class: "room-head" },
        el("div", { class: "title-wrap" },
          el("h1", {}, meta.title || "Untitled meeting"),
          el("div", { class: "meta" }, dateLabel, " · ", fmt12h(startMin), "–", fmt12h(endMin), " · ", meta.tz)
        ),
        el("div", { class: "room-actions" },
          el("button", { class: "btn", onClick: () => openShare(roomId, meta.title) },
            el("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, el("path", { d: "M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" }), el("polyline", { points: "16 6 12 2 8 6" }), el("line", { x1: 12, y1: 2, x2: 12, y2: 15 })),
            "Share"
          ),
          el("button", { class: "btn btn-ghost", onClick: changeName, title: "Change name" },
            el("span", { class: "sw", style: { display: "inline-block", width: "8px", height: "8px", borderRadius: "50%", background: myColor, marginRight: "6px" } }),
            myName
          )
        )
      );
      view.appendChild(head);

      // TZ banner
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      if (localTz !== meta.tz) {

    function computeBestWindows(tally, allPids, dates, slotsPerDay, startMin, slotMin, duration) {
      const N = allPids.length;
      if (!N) return [];
      const slotsNeeded = Math.max(1, Math.round(duration / slotMin));
      const windows = [];
      for (const dateStr of dates) {
        for (let si = 0; si + slotsNeeded <= slotsPerDay; si++) {
          const keys = [];
          for (let k = 0; k < slotsNeeded; k++) {
            const t = startMin + (si + k) * slotMin;
            keys.push(`${dateStr}_${String(t).padStart(4, "0")}`);
          }
          const yesPids = [], maybePids = [], noPids = [];
          for (const pid of allPids) {
            let allYes = true, allYesOrMaybe = true;
            for (const k of keys) {
              const status = (tally[k] && (tally[k].yes.includes(pid) ? "yes" : tally[k].maybe.includes(pid) ? "maybe" : null));
              if (status !== "yes") allYes = false;
              if (status !== "yes" && status !== "maybe") allYesOrMaybe = false;
            }
            if (allYes) yesPids.push(pid);
            else if (allYesOrMaybe) maybePids.push(pid);
            else noPids.push(pid);
          }
          const yes = yesPids.length, maybe = maybePids.length;
          const score = yes + 0.5 * maybe;
          if (score > 0) {
            windows.push({
              dateStr, startMin: startMin + si * slotMin, keys,
              scoreYes: yes, scoreMaybe: maybe, score,
              yesPids, maybePids, noPids
            });
          }
        }
      }
      windows.sort((a, b) => b.score - a.score || a.startMin - b.startMin);

      const final = [];
      const used = new Set();
      for (const w of windows) {
        const overlap = w.keys.some(k => used.has(k));
        if (!overlap) {
          final.push(w);
          w.keys.forEach(k => used.add(k));
          if (final.length >= 8) break;
        }
      }
      return final;
    }

          ),
          el("div", { class: "field" },
            el("label", {}, "Password ", el("span", { style: { color: "var(--text-faint)", fontWeight: "400" } }, "(optional)")),
            pwInput,
            el("div", { class: "field-help" },
              opts.isRename
                ? "Set a new password to protect this name (leave blank to keep current)."
                : "Set a password so you can edit your response from another device — or to lock this name. Leave blank if you don't need to."
            )
          ),
          errorBox,
          el("div", { class: "modal-foot" },
            el("button", { class: "btn btn-ghost", onClick: () => { bg.remove(); resolve(null); } }, "Cancel"),
            el("button", { class: "btn btn-primary", onClick: join }, opts.isRename ? "Save" : "Join")
          )
        ));
        document.body.appendChild(bg);
        setTimeout(() => nameInput.focus(), 60);
        nameInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); pwInput.focus(); } });
        pwInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); join(); } });
      });
    }

    // ============================================================
    // Calendar export
    // ============================================================
    function exportSlot(meta, w, duration) {
      const startDate = parseYmd(w.dateStr);
      const startH = Math.floor(w.startMin / 60);
      const startM = w.startMin % 60;
      const start = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate(), startH, startM);
      const end = new Date(start.getTime() + duration * 60000);
      const fmt = (d) => d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0") + "T" + String(d.getUTCHours()).padStart(2,"0") + String(d.getUTCMinutes()).padStart(2,"0") + "00Z";
      const title = meta.title || "Meeting";
      const desc = `Scheduled via Whenly`;

      // Show options modal
      const bg = el("div", { class: "modal-bg", onClick: e => { if (e.target === bg) bg.remove(); } });
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmt(start)}/${fmt(end)}&details=${encodeURIComponent(desc)}`;
      const icsBlob = new Blob([buildIcs(title, desc, start, end)], { type: "text/calendar" });
      const icsHref = URL.createObjectURL(icsBlob);
      bg.appendChild(el("div", { class: "modal modal-sm" },
        el("h2", {}, "Add to calendar"),
        el("p", { class: "modal-sub" }, `${DOW[startDate.getDay()]} ${MO_SHORT[startDate.getMonth()]} ${startDate.getDate()} · ${fmt12h(w.startMin)} – ${fmt12h(w.startMin + duration)}`),
        el("div", { class: "stack" },
          el("a", { class: "btn btn-primary", href: gcalUrl, target: "_blank", rel: "noopener", style: { justifyContent: "center" } }, "Google Calendar"),
          el("a", { class: "btn", href: icsHref, download: `${title.replace(/[^\w]+/g, "-")}.ics`, style: { justifyContent: "center" } }, "Download .ics (Apple, Outlook)")
        ),
        el("div", { class: "modal-foot" }, el("button", { class: "btn btn-ghost", onClick: () => bg.remove() }, "Close"))
      ));
      document.body.appendChild(bg);
    }
    function buildIcs(title, desc, start, end) {
      const fmt = (d) => d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0") + "T" + String(d.getUTCHours()).padStart(2,"0") + String(d.getUTCMinutes()).padStart(2,"0") + "00Z";
      return [
        "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Whenly//EN","BEGIN:VEVENT",
        `UID:${randId(12)}@whenly`,`DTSTAMP:${fmt(new Date())}`,
        `DTSTART:${fmt(start)}`,`DTEND:${fmt(end)}`,
        `SUMMARY:${title.replace(/\n/g, " ")}`,`DESCRIPTION:${desc.replace(/\n/g, "\\n")}`,
        "END:VEVENT","END:VCALENDAR"
      ].join("\r\n");
    }

    // ============================================================
    // TZ helper
    // ============================================================
    function tzOffsetMessage(local, meeting) {
      try {
        const now = new Date();
        const localStr = now.toLocaleString("en-US", { timeZone: local, hour: "numeric", hour12: false });
        const meetStr = now.toLocaleString("en-US", { timeZone: meeting, hour: "numeric", hour12: false });
        const a = parseInt(localStr, 10), b = parseInt(meetStr, 10);
        let diff = a - b;
        if (diff > 12) diff -= 24;
        if (diff < -12) diff += 24;
        if (diff === 0) return "Same offset.";
        return `You're ${Math.abs(diff)}h ${diff > 0 ? "ahead of" : "behind"} the meeting TZ.`;
      } catch { return ""; }
    }

    function showErr(view, msg) {
      view.innerHTML = "";
      view.appendChild(el("div", { class: "panel center" },
        el("h2", {}, "Hmm."),
        el("p", { class: "text-dim" }, msg),
        el("button", { class: "btn", onClick: () => location.hash = "" }, "Back home")
      ));
    }
  </script>
